name: Checks

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.1"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-linux-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/godot-bin/godot" ]; then
            mkdir -p "$HOME/godot-bin"
            curl -fsSL -o /tmp/godot.zip \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q /tmp/godot.zip -d /tmp/godot-extract
            mv "/tmp/godot-extract/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot-bin/godot"
            chmod +x "$HOME/godot-bin/godot"
          fi
          "$HOME/godot-bin/godot" --version

      - name: Import project
        run: |
          "$HOME/godot-bin/godot" --headless --path . --import

      - name: Data + script smoke test
        run: |
          "$HOME/godot-bin/godot" --headless --path . --script res://tools/smoke_test.gd

      - name: Gameplay simulation test
        run: |
          timeout 180 "$HOME/godot-bin/godot" --headless --path . -- --sim-test
